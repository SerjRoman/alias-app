services:
    alias-redis-service:
        image: redis:latest
        container_name: alias_redis
        restart: always
        ports:
            - ${REDIS_SERVICE_PORT}:6379
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
            interval: 1s
            timeout: 3s
            retries: 5
        command: redis-server --appendonly yes --replica-read-only no --requirepass ${REDIS_SERVICE_PASSWORD}
    alias-postgres-service:
        image: postgres:18
        container_name: alias_postgres
        restart: always
        environment:
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - ${DB_PORT}:5432
        volumes:
            - postgres_data:/var/lib/postgresql
    pgadmin:
      image: dpage/pgadmin4
      container_name: pg_ui
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@admin.com
        PGADMIN_DEFAULT_PASSWORD: admin_password
      ports:
        - "8080:80"
      depends_on:
        - alias-postgres-service

volumes:
    redis_data:
    postgres_data:
