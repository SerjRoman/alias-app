services:
    alias-redis-service:
        image: redis:latest
        container_name: alias_redis
        restart: always
        ports:
            - ${REDIS_SERVICE_PORT}:6379
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
            interval: 1s
            timeout: 3s
            retries: 5
        command: redis-server --appendonly yes --replica-read-only no --requirepass ${REDIS_SERVICE_PASSWORD}
volumes:
    redis_data:
